name: Packed Release Candidate Verification

on:
  workflow_dispatch:
    inputs:
      framework_sha:
        description: "Exact agbossjs/agboss commit SHA to pack and verify (defaults to .agboss-version.json)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-packed-rc:
    name: Full P0 + P1 Packed Tarball Verification (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1a. Checkout agboss-examples
        uses: actions/checkout@v4

      - name: 1b. Resolve & verify pinned framework SHA
        id: pin
        run: |
          EXAMPLES_SHA="$(git rev-parse HEAD)"
          PINNED_SHA="$(node -p "JSON.parse(require('node:fs').readFileSync('.agboss-version.json', 'utf8')).frameworkSha")"
          TARGET_SHA="${{ inputs.framework_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$PINNED_SHA"
          fi
          if [ -z "$TARGET_SHA" ]; then
            echo "::error::Missing frameworkSha in .agboss-version.json and workflow_dispatch input"
            exit 1
          fi
          echo "examples_sha=$EXAMPLES_SHA" >> "$GITHUB_OUTPUT"
          echo "framework_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: 1c. Checkout agbossjs/agboss at exact pinned SHA (no fallback to main)
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.framework_sha }}
          path: .agboss-source

      - name: 1d. Assert checked-out framework commit matches target SHA
        run: |
          ACTUAL_SHA="$(git -C .agboss-source rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.pin.outputs.framework_sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out framework SHA ($ACTUAL_SHA) does not match expected SHA ($EXPECTED_SHA)"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: 2. Install root tooling & framework dependencies + run tooling tests
        run: |
          npm ci
          npm run typecheck
          npm --prefix .agboss-source ci

      - name: 3. Verify framework source integrity & build agboss + agboss-cli
        run: |
          npm --prefix .agboss-source run check:root
          npm --prefix .agboss-source run check:suppressions
          npm --prefix .agboss-source run build
          npm --prefix .agboss-source run check:api
          npm --prefix .agboss-source run check:docs

      - name: 4. Pack agboss & agboss-cli release tarballs
        env:
          AGBOSS_REPO_DIR: .agboss-source
          VERIFY_PINNED_FRAMEWORK_SHA: "1"
        run: npm run pack:framework

      - name: 5. Verify tarball inventory, isolated consumer & clean scaffold outside both repos
        run: |
          npm run verify:package
          npm run verify:published -- --from-packed --version 0.1.0

      - name: 6. Install packed tarballs into example projects (01..07)
        run: npm run install:packed

      - name: 7. Run static graph & TypeScript checks across P0 + P1 (01..07)
        run: node scripts/run-all.mjs --provenance rc --include-p1 --reset --mode check

      - name: 8. Run offline deterministic unit & fault-injection tests across P0 + P1 (01..07)
        run: node scripts/run-all.mjs --provenance rc --include-p1 --mode test

      - name: 9. Run offline deterministic demos across P0 + P1 (01..07)
        env:
          AGBOSS_OFFLINE_VERIFY: "1"
        run: node scripts/run-all.mjs --provenance rc --include-p1 --mode demo

      - name: 10. Collect and enforce fail-closed P0 + P1 proof report
        run: |
          node scripts/collect-results.mjs --provenance rc --require-p1
          cat proof-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 11. Restore public package.json manifests and verify clean git status
        run: |
          npm run install:packed -- --restore
          DIRTY_TRACKED="$(git status --porcelain --untracked-files=no)"
          if [ -n "$DIRTY_TRACKED" ]; then
            echo "::error::Tracked files were left modified after restore:"
            echo "$DIRTY_TRACKED"
            exit 1
          fi

      - name: 11b. Verify required release proof artifacts exist and are non-empty
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import crypto from "node:crypto";
            import fs from "node:fs";

            const requiredFiles = [
              ".packed/agboss-0.1.0.tgz",
              ".packed/agboss-cli-0.1.0.tgz",
              ".packed/manifest.json",
              ".packed/package-verification.json",
              ".packed/published-verification.json",
              ".packed/last-run.json",
              "proof-results.json",
              "proof-report.md",
            ];

            for (const relPath of requiredFiles) {
              assert.equal(fs.existsSync(relPath), true, `Missing required artifact file: ${relPath}`);
              const stat = fs.statSync(relPath);
              assert.equal(stat.isFile(), true, `Not a regular file: ${relPath}`);
              assert.equal(stat.size > 0, true, `Empty artifact file: ${relPath}`);
            }

            const manifest = JSON.parse(fs.readFileSync(".packed/manifest.json", "utf8"));
            for (const [key, relPath] of [
              ["agboss", ".packed/agboss-0.1.0.tgz"],
              ["agbossCli", ".packed/agboss-cli-0.1.0.tgz"],
            ]) {
              const buf = fs.readFileSync(relPath);
              const sha256 = crypto.createHash("sha256").update(buf).digest("hex");
              assert.equal(buf.length, manifest.packages[key].size, `Size mismatch for ${relPath}`);
              assert.equal(sha256, manifest.packages[key].sha256, `SHA-256 mismatch for ${relPath}`);
            }
            console.log("[verify-artifacts] All 8 packed-release proof files exist, are non-empty, and match manifest.");
          '

      - name: 12. Upload release proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packed-release-proof-${{ steps.pin.outputs.framework_sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .packed/agboss-0.1.0.tgz
            .packed/agboss-cli-0.1.0.tgz
            .packed/manifest.json
            .packed/package-verification.json
            .packed/published-verification.json
            .packed/last-run.json
            proof-results.json
            proof-report.md
            !**/.env*
            !**/.npmrc
            !**/.git/**
            !**/.packed/.npm-cache/**
            !**/.packed/install-record.json
