name: Nightly Full Suite (P0 + P1 + Live Model Opt-In)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_live_models:
        description: "Run live LLM model smoke checks (requires OPENROUTER_API_KEY)"
        required: false
        default: false
        type: boolean
      framework_sha:
        description: "Exact agbossjs/agboss commit SHA (defaults to .agboss-version.json)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  nightly-full:
    name: Full P0 + P1 Verification Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout agboss-examples
        uses: actions/checkout@v4

      - name: Resolve pinned framework SHA
        id: pin
        run: |
          PINNED_SHA="$(node -p "JSON.parse(require('node:fs').readFileSync('.agboss-version.json', 'utf8')).frameworkSha")"
          TARGET_SHA="${{ inputs.framework_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="$PINNED_SHA"
          fi
          echo "framework_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout agbossjs/agboss at exact pinned SHA
        uses: actions/checkout@v4
        with:
          repository: agbossjs/agboss
          ref: ${{ steps.pin.outputs.framework_sha }}
          path: .agboss-source

      - name: Resolve the pinned @agboss/postgres (agbossjs/agboss#487)
        id: postgres-pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').postgres.sha")" >> "$GITHUB_OUTPUT"

      - name: Checkout agbossjs/postgres at its pinned SHA (packed with the core until it is on npm)
        uses: actions/checkout@v4
        with:
          repository: agbossjs/postgres
          ref: ${{ steps.postgres-pin.outputs.sha }}
          path: .agboss-postgres-source

      - name: Resolve the pinned @agboss/mongodb (agbossjs/agboss#891)
        id: mongodb-pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').mongodb.sha")" >> "$GITHUB_OUTPUT"

      - name: Checkout agbossjs/mongodb at its pinned SHA (packed with the core until it is on npm)
        uses: actions/checkout@v4
        with:
          repository: agbossjs/mongodb
          ref: ${{ steps.mongodb-pin.outputs.sha }}
          path: .agboss-mongodb-source

      - name: Resolve the pinned @agboss/redis (agbossjs/agboss#891)
        id: redis-pin
        run: echo "sha=$(node -p "require('./.agboss-version.json').redis.sha")" >> "$GITHUB_OUTPUT"

      - name: Checkout agbossjs/redis at its pinned SHA (packed with the core until it is on npm)
        uses: actions/checkout@v4
        with:
          repository: agbossjs/redis
          ref: ${{ steps.redis-pin.outputs.sha }}
          path: .agboss-redis-source

      - name: Assert checked-out framework commit matches target SHA
        run: |
          ACTUAL_SHA="$(git -C .agboss-source rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.pin.outputs.framework_sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out framework SHA ($ACTUAL_SHA) does not match expected SHA ($EXPECTED_SHA)"
            exit 1
          fi

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Reviewed installs only, no real-time thresholds (agbossjs/agboss#523)
        run: npm run check:installs && npm run check:real-time

      - name: Install dependencies & pack framework
        env:
          AGBOSS_REPO_DIR: .agboss-source
          AGBOSS_POSTGRES_DIR: .agboss-postgres-source
          AGBOSS_MONGODB_DIR: .agboss-mongodb-source
          AGBOSS_REDIS_DIR: .agboss-redis-source
          VERIFY_PINNED_FRAMEWORK_SHA: "1"
        run: |
          npm ci
          npm run typecheck
          npm --prefix .agboss-source ci
          npm run pack:framework
          npm run verify:package
          npm run install:packed

      - name: Run P0 + P1 check, test, and demo
        env:
          AGBOSS_OFFLINE_VERIFY: "1"
        run: |
          node scripts/run-all.mjs --include-p1 --reset --mode check
          node scripts/run-all.mjs --include-p1 --mode test
          node scripts/run-all.mjs --include-p1 --mode demo

      - name: Optional Live Model Smoke (01-hello-agboss)
        if: ${{ inputs.run_live_models == true }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            npm --prefix 01-hello-agboss run demo:live
          else
            echo "OPENROUTER_API_KEY not configured; skipping live model run."
          fi

      - name: Collect proof report & restore manifests
        run: |
          node scripts/collect-results.mjs --require-p1
          cat proof-report.md >> "$GITHUB_STEP_SUMMARY"
          npm run install:packed -- --restore

      - name: Upload nightly proof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-proof-report-${{ steps.pin.outputs.framework_sha }}
          path: |
            .packed/manifest.json
            .packed/package-verification.json
            .packed/last-run.json
            proof-results.json
            proof-report.md
          if-no-files-found: error
