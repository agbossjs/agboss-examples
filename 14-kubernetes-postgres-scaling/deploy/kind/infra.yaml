# The cluster's infrastructure (agbossjs/agboss#487): the namespace, the demo secrets (synthetic,
# R6), PostgreSQL in-cluster (emptyDir: a demo database, not a production one) and the ledger stub —
# the other system the jobs call.
apiVersion: v1
kind: Namespace
metadata:
  name: agboss
---
apiVersion: v1
kind: Secret
metadata:
  name: agboss-secrets
  namespace: agboss
type: Opaque
stringData:
  POSTGRES_PASSWORD: kind-demo-only
  POSTGRES_URL: postgres://postgres:kind-demo-only@postgres:5432/postgres
  PII_PSEUDONYM_KEY: kind-demo-synthetic-pseudonym-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agboss
  labels: { app.kubernetes.io/name: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
          args: ["-c", "max_connections=60", "-c", "shared_buffers=64MB"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agboss-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 2
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agboss
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-stub
  namespace: agboss
  labels: { app.kubernetes.io/name: ledger-stub }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ledger-stub }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ledger-stub }
    spec:
      containers:
        - name: stub
          image: agboss-scaling:local
          imagePullPolicy: Never
          args: ["node", "dist/stub-main.js"]
          env:
            - { name: STUB_PORT, value: "8081" }
          ports:
            - { name: http, containerPort: 8081 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-stub
  namespace: agboss
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: ledger-stub }
  ports:
    - { name: http, port: 8081, targetPort: http, nodePort: 30081 }
