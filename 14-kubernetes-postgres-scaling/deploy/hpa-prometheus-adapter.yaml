# Autoscaling with a plain HPA on prometheus-adapter's external metric (agbossjs/agboss#486):
# AverageValue 4 per pod (= maxConcurrentSteps) → replicas = ⌈slot demand / 4⌉. Same behavior as
# the KEDA ScaledObject; use one of the two, not both.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agboss-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agboss-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: External
      external:
        metric:
          name: agboss_slot_demand
        target:
          type: AverageValue
          averageValue: "4"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - { type: Percent, value: 100, periodSeconds: 15 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
